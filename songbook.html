<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >
    <meta name="theme-color" content="#4AAEE8">

    <title>Canti</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/songbook.css">
</head>

<body class="new-songbook-page">

<header class="songbook-header">

    <!-- Guitar tuner: LEFT -->
    <a
        id="openTuner"
        href="guitar-tuner.html"
        class="header-action guitar-button"
        aria-label="Apri accordatore"
        title="Accordatore"
        style="text-decoration: none;"
    >
        <!-- Guitar tuner icon -->
        <svg
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
        >
            <path
                d="M50 12 C36 12 17 22 18 39
                   C19 57 39 78 50 87
                   C61 78 81 57 82 39
                   C83 22 64 12 50 12Z"
                fill="#FFFFFF"
            />
            <path
                d="M39 37 V30 Q39 25 44 25
                   M61 37 V30 Q61 25 56 25
                   M39 37 V44 Q39 49 44 49
                   H56 Q61 49 61 44 V37
                   M50 49 V65"
                fill="none"
                stroke="#1683c6"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />
            <circle cx="50" cy="69" r="3" fill="#1683c6" />
        </svg>
    </a>

    <!-- Title -->
    <h1>Canti</h1>

</header>

    <main class="songbook-main">

        <div class="song-search-wrapper">
            <input
                type="search"
                id="searchSong"
                placeholder="Cerca un canto..."
                autocomplete="off"
                aria-label="Cerca un canto per titolo o numero"
            >

            <button
                type="button"
                id="clearSearch"
                aria-label="Cancella ricerca"
                hidden
            >×</button>
        </div>

        <div
            id="songCategories"
            class="song-categories"
            aria-live="polite"
        ></div>

        <p id="noSongsFound" hidden>
            Nessun canto trovato.
        </p>

    </main>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
    <script src="js/songs-generated.js"></script>
    <script src="js/songbook.js"></script>

</body>
</html>
