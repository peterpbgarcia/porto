<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Guitar Tuner</title>


    <!-- =========================
         UNIVERSAL APP CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =========================
         TUNER CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="css/guitar-tuner.css"
    >

</head>


<body>


<!-- =========================
     HEADER
========================== -->





<!-- =========================
     MAIN
========================== -->

<main class="tuner-page">


    <!-- =========================
         MAIN TUNER CARD
    ========================== -->

    <section class="tuner-card">


        <!-- DETECTED NOTE -->

        <div class="note-display">

            <div
                id="detected-note"
                class="detected-note"
            >
                —
            </div>


            <div
                id="detected-octave"
                class="detected-octave"
            >
                —
            </div>


            <div
                id="detected-frequency"
                class="detected-frequency"
            >
                0.0 Hz
            </div>

        </div>



        <!-- TUNING METER -->

        <div class="tuning-meter">

            <div class="meter-labels">

                <span>♭</span>

                <span>♯</span>

            </div>


            <div class="meter-track">

                <div class="meter-center"></div>


                <div
                    id="meter-indicator"
                    class="meter-indicator"
                ></div>

            </div>

        </div>



        <!-- TUNING STATUS -->

        <div
            id="tuning-status"
            class="tuning-status"
        >
            Ready
        </div>


        <div
            id="cents-display"
            class="cents-display"
        >
            —
        </div>



        <!-- MICROPHONE STATUS -->

        <div
            id="microphone-status"
            class="microphone-status"
        >
            Press Start Tuner to begin
        </div>



        <!-- START BUTTON -->

        <button
            id="start-button"
            class="start-button"
            type="button"
        >
            🎤 Start Tuner
        </button>


    </section>



    <!-- =========================
         STRINGS / MODE
    ========================== -->

    <section class="strings-section">


        <div class="strings-grid">


            <!-- LOW E -->

            <button
                type="button"
                class="string-button"
                data-note="E2"
                data-frequency="82.41"
            >

                <span class="string-note">
                    E
                </span>

                <span class="string-octave">
                    E2
                </span>

            </button>



            <!-- A -->

            <button
                type="button"
                class="string-button"
                data-note="A2"
                data-frequency="110.00"
            >

                <span class="string-note">
                    A
                </span>

                <span class="string-octave">
                    A
                </span>

            </button>



            <!-- D -->

            <button
                type="button"
                class="string-button"
                data-note="D3"
                data-frequency="146.83"
            >

                <span class="string-note">
                    D
                </span>

                <span class="string-octave">
                    D
                </span>

            </button>



            <!-- G -->

            <button
                type="button"
                class="string-button"
                data-note="G3"
                data-frequency="196.00"
            >

                <span class="string-note">
                    G
                </span>

                <span class="string-octave">
                    G
                </span>

            </button>



            <!-- B -->

            <button
                type="button"
                class="string-button"
                data-note="B3"
                data-frequency="246.94"
            >

                <span class="string-note">
                    B
                </span>

                <span class="string-octave">
                    B
                </span>

            </button>



            <!-- HIGH E -->

            <button
                type="button"
                class="string-button"
                data-note="E4"
                data-frequency="329.63"
            >

                <span class="string-note">
                    E
                </span>

                <span class="string-octave">
                    E4
                </span>

            </button>


        </div>


    </section>


</main>



<!-- =========================
     GUITAR TUNER JAVASCRIPT
========================== -->

<script src="js/guitar-tuner.js"></script>


</body>

</html>
