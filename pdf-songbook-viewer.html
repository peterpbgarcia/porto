
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >
    <meta name="theme-color" content="#4AAEE8">

    <title>Canti</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            background: #fff;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* HEADER */

        .pdf-song-viewer-header {
            position: relative;
            z-index: 10;
            flex: 0 0 64px;
            width: 100%;
            height: 64px;
            display: grid;
            grid-template-columns: 56px 1fr 56px;
            align-items: center;
            padding: 0 8px;
            background: #4AAEE8;
            color: #fff;
            box-shadow: 0 2px 5px rgb(0 0 0 / 12%);
        }

        .pdf-song-viewer-header h1 {
            margin: 0;
            text-align: center;
            font-size: 22px;
            font-weight: normal;
            line-height: 1;
        }

        .pdf-header-action {
            width: 44px;
            height: 44px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            justify-self: center;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #fff;
            font-family: inherit;
            font-size: 27px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .pdf-header-action:active {
            background: rgb(255 255 255 / 18%);
        }

        .pdf-header-action svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* PDF AREA */

        .pdf-song-viewport {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        #pdfFrame {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            background: #fff;
        }

        @media (min-width: 769px) {
            .pdf-song-viewer-header {
                flex-basis: 70px;
                height: 70px;
            }

            .pdf-song-viewer-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body class="pdf-song-viewer-page">

    <header class="pdf-song-viewer-header">

        <button
            id="openTuner"
            class="pdf-header-action guitar-button"
            type="button"
            aria-label="Apri accordatore"
            title="Accordatore"
        >🎸</button>

        <h1>Canti</h1>

        <button
            id="closeViewer"
            class="pdf-header-action"
            type="button"
            aria-label="Chiudi PDF"
            title="Chiudi"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"/>
            </svg>
        </button>

    </header>

    <main class="pdf-song-viewport">
        <iframe
            id="pdfFrame"
            title="PDF del canto"
            src="about:blank"
        ></iframe>
    </main>

    <script src="js/pdf-songbook-viewer.js"></script>

</body>
</html>
