
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    >
    <meta name="theme-color" content="#4AAEE8">

    <title>Canto</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body.pdf-song-viewer-page {
            display: flex;
            flex-direction: column;
            background: #FFFFFF;
        }

        .pdf-song-viewer-header {
            display: grid;
            grid-template-columns: 56px 1fr 56px;
            flex: 0 0 42px;
            padding: 0 8px;
        }

        .pdf-header-action {
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            justify-self: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .pdf-header-action:active {
            background: rgb(255 255 255 / 18%);
        }

        .guitar-button svg {
            width: 34px;
            height: 34px;
        }

        .pdf-song-viewport {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #FFFFFF;
        }

        #pdfFrame {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            background: #FFFFFF;
        }
    </style>
</head>

<body class="pdf-song-viewer-page">

    
<header class="pdf-song-viewer-header">
    <button
        id="openTuner"
        class="pdf-header-action guitar-button"
        type="button"
        aria-label="Apri accordatore"
        title="Accordatore"
    >
        <svg
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
            focusable="false"
        >
            <!-- Guitar pick -->
            <path
                d="M50 12
                   C36 12 17 22 18 39
                   C19 57 39 78 50 87
                   C61 78 81 57 82 39
                   C83 22 64 12 50 12Z"
                fill="#FFFFFF"
            />

            <!-- Tuning fork -->
            <path
                d="M39 37 V30
                   Q39 25 44 25
                   M61 37 V30
                   Q61 25 56 25
                   M39 37 V44
                   Q39 49 44 49
                   H56
                   Q61 49 61 44
                   V37
                   M50 49 V65"
                fill="none"
                stroke="#1683c6"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round"
            />

            <circle
                cx="50"
                cy="69"
                r="3"
                fill="#1683c6"
            />
        </svg>
    </button>
</header>


    <main class="pdf-song-viewport">
        <iframe
            id="pdfFrame"
            title="PDF del canto"
            src="about:blank"
        ></iframe>
    </main>

    <script src="js/pdf-songbook-viewer.js"></script>

</body>
</html>
